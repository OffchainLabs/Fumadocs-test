name: Upstream refresh

# Bumps the pinned Nitro release in content/vars.json and regenerates every file this repo
# derives from an upstream source (precompile tables, contract addresses), then opens a PR
# with whatever changed. Opens nothing when everything is current.
#
# The generators run unconditionally rather than only after a version bump: the precompile
# tables also go stale when a pin in the generator changes or a doc comment is edited
# upstream at the same commit. The contract-address generator is the exception, and runs
# here only as a backstop; see the comment on its step for why it cannot normally change
# anything.
#
# No Go or Rust toolchain is installed. The CLI flags generator reads Nitro's Go source
# rather than running `nitro --help`, precisely so this job stays a plain Node job.
#
# The second job, `stylus`, regenerates the Stylus by Example pages from the third-party repo
# they are republished from, onto its own branch. The two are independent, with no `needs` between
# them, so a failed generator never hides the other job's result.
#
# "Upstream" here means the pinned Nitro release, go-ethereum, the @arbitrum/sdk network registry
# and offchainlabs/stylus-by-example. It no longer means the Docusaurus arbitrum-docs repo: the
# third job, `drift`, compared this repo's content tree against that one and was deleted with the
# rest of the coupling when this repo replaced it (FS-2706).

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-refresh
  cancel-in-progress: false

permissions:
  contents: read # default for any job that does not narrow it

jobs:
  refresh:
    name: Refresh generated content
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/upstream-refresh branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump the pinned Nitro release
        id: nitro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nitro:check-release

      - name: Regenerate precompile tables
        run: pnpm precompiles:generate

      # A backstop, and expected to be a no-op. Unlike the step above this one has no input that
      # moves on its own: the install is --frozen-lockfile, so it reads the same pinned
      # @arbitrum/sdk registry main was generated from, and `contracts:check` blocks every PR, so
      # main is already current with that pin. A Dependabot SDK bump therefore arrives already
      # regenerated, having had to pass that gate. What is left for this step to catch is a hand
      # edit that reached main without the gate, an admin merge or a direct push. No network
      # access, unlike the step above.
      - name: Regenerate contract addresses
        run: pnpm contracts:generate

      # Shallow-clones Nitro at the tag pinned above (plus its go-ethereum submodule, where the
      # execution.rpc.* flags are registered) and parses the flag registrations out of the Go.
      # Runs after the pin bump so a new release is reflected in the same PR.
      - name: Regenerate the Nitro CLI flags reference
        run: pnpm cli:generate

      # zizmor: ignore[superfluous-actions]
      # zizmor suggests `gh pr create`, which would mean hand-rolling the branch/commit/push
      # plumbing and a "did anything change?" check. create-pull-request does all of that and
      # no-ops when the tree is clean, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/upstream-refresh
          delete-branch: true
          commit-message: 'chore: refresh generated content from upstream'
          title: 'chore: refresh generated content from upstream'
          body: |
            Automated refresh of content generated from upstream sources.

            - `content/vars.json`: pinned Nitro release, node Docker image and go-ethereum submodule
            - `content/partials/precompile-tables/`: regenerated from the Solidity
              interfaces and Go implementations at the pinned refs
            - `content/partials/_reference-arbitrum-contract-addresses-partial.mdx`:
              regenerated from the `@arbitrum/sdk` network registry plus
              `scripts/data/contract-addresses.data.ts`
            - `content/docs/run-a-node/nitro/cli-flags-reference.mdx`: the region between the
              `GENERATED` markers, read from the Nitro source at the pinned tag

            Nitro pin after this run: `${{ steps.nitro.outputs.updated_version || 'unchanged' }}`

            Generated by the `upstream-refresh` workflow. Reproduce locally with
            `pnpm nitro:check-release && pnpm precompiles:generate && pnpm contracts:generate &&
            pnpm cli:generate`.

  # Regenerates content/docs/stylus/stylus-by-example/ from offchainlabs/stylus-by-example, which
  # is a live third-party repository this site republishes. Ported from the `stylus-content` job
  # of arbitrum-docs `update-external-content.yml`, which does not survive that repo being
  # archived; without it those pages freeze and an upstream edit reaches this site through nobody.
  #
  # Its own job, on its own branch, rather than another step in `refresh`, for the reason the
  # `drift` job is independent too: a failure here must not hide a Nitro pin bump, and nineteen
  # pages of changed prose in the same PR as a regenerated address table is a PR nobody reviews.
  # The two need different reviewers anyway — this one is a content change.
  #
  # No pin: stylus-by-example publishes no releases and this site has always tracked its default
  # branch, so the generator clones that. See the header of scripts/generate-stylus-examples.ts
  # for why `stylus:check` is deliberately not a CI gate.
  #
  # It runs the blocking gates itself, between the generator and the PR, because a PR opened with
  # GITHUB_TOKEN triggers no workflow runs and so receives no CI. See the comment on those steps.
  stylus:
    name: Refresh Stylus by Example
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/stylus-by-example branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Needed for Prettier, which is what makes the generated pages byte-stable and `--check`
      # meaningful. The generator itself clones upstream on its own and needs no other dependency.
      - run: pnpm install --frozen-lockfile

      # Also logs the upstream examples this site does not publish, which is the only signal
      # anyone gets that stylus-by-example has added one worth porting.
      - name: Regenerate the Stylus by Example pages
        run: pnpm stylus:generate

      # Everything from here to the create-pull-request step is `ci.yml`'s `Gates` job, step for
      # step and in the same order, run against the regenerated tree.
      #
      # It is here because the pull request this job opens gets no CI at all. GitHub raises no
      # workflow run for an event created with `GITHUB_TOKEN` (its own rule, so a workflow cannot
      # recurse), and `ci.yml` triggers only on push/pull_request against `main`, which a push to
      # `automated/stylus-by-example` is not. The PR therefore arrives with an empty checks tab,
      # which reads as green. Its payload is nineteen pages of prose, frontmatter and MDX written
      # in a repository this project neither controls nor pins, so it is the automated PR that
      # most needs checking, and these gates are exactly the ones that would catch an upstream
      # edit breaking this site.
      #
      # Running them here fails the weekly run instead of shipping an unverified PR, and needs no
      # new secret. The alternative — a PAT or GitHub App token on create-pull-request, which
      # would make `ci.yml` run for real — is a secret nobody has provisioned.
      #
      # Keep this list in sync with ci.yml's blocking set: a gate added there and not here is a
      # gate this PR does not get. That set is the `Gates` job plus, since FS-2746, the `Build`
      # job, which is why `pnpm build` and the server step below appear here too.
      - name: Type check (regenerates .source/, then tsc)
        run: pnpm types:check

      - name: Script test suites
        run: pnpm test

      - name: Global variables resolve
        run: pnpm vars:check

      - name: Navigation integrity
        run: pnpm nav:check

      - name: Partials resolve and stay unrouted
        run: pnpm partials:check

      - name: Archived page registry
        run: node scripts/versioned-docs-check.ts

      - name: Glossary references resolve
        run: pnpm references:check

      - name: FAQ structured-data ids resolve
        run: pnpm faq:check

      - name: No remote markdown images
        run: pnpm images:presence

      - name: Internal links
        run: pnpm check-links

      - name: Generated contract addresses are current
        run: pnpm contracts:check

      - name: Formatting
        run: pnpm format:check

      - name: MDX structural lint
        run: pnpm content:lint

      # The `Build` half of ci.yml's blocking set, and the half this payload most needs: an MDX
      # compile error is the defect no other step here can see, and nineteen pages of prose from a
      # repository this project neither controls nor pins is where one would come from.
      - run: pnpm build

      # Identical to ci.yml's step of the same name, for the same reason: the check reads
      # `/llms.txt` off a running site and the build above is already here to reuse.
      - name: Redirects and static docs routing against the built site
        run: |
          set -euo pipefail
          # `npx next start`, not `pnpm start`: `$!` would be the pnpm wrapper, and killing that
          # orphans the server. Output to a file: a server on this step's stdout holds the pipe
          # open and hangs the step until the job timeout.
          log="$RUNNER_TEMP/next-start.log"
          npx next start > "$log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/llms.txt; then ready=1; break; fi
            # a server that died on boot should not wait out the full 120s
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat "$log"
            echo "::error::next start never served /llms.txt"
            exit 1
          fi
          pnpm redirects:check
          STATIC_DOCS_TEST_URL=http://localhost:3000 node --test scripts/static-docs-http.test.ts

      # zizmor: ignore[superfluous-actions]
      # Same reasoning as the `refresh` job: create-pull-request owns the branch/commit/push
      # plumbing and no-ops when nothing changed, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/stylus-by-example
          delete-branch: true
          commit-message: 'chore: refresh Stylus by Example content from upstream'
          title: 'chore: refresh Stylus by Example content from upstream'
          body: |
            Automated refresh of `content/docs/stylus/stylus-by-example/`, regenerated from
            [offchainlabs/stylus-by-example](https://github.com/offchainlabs/stylus-by-example)
            by the `upstream-refresh` workflow.

            These pages are generated. Review this as a content change to upstream's examples,
            not as an edit to this repo: anything wrong here has to be fixed in
            `offchainlabs/stylus-by-example`, or in
            `scripts/data/stylus-examples.data.ts` if the published set is what is wrong.

            Reproduce locally with `pnpm stylus:generate`. Check the run log for upstream
            examples this site does not publish — that list is the only notice anyone gets
            that a new example exists.

            **The checks tab on this PR is empty and that is expected.** A pull request opened
            with `GITHUB_TOKEN` triggers no workflow runs, so `ci.yml` never sees this branch.
            Every blocking gate ran inside the `stylus` job against this exact tree before the
            PR was opened, and the run had to be green to get here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
